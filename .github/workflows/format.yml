name: Autoformat milestone branches

on:
  push:
    branches: ["m*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  formatting:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "ruff==0.9.6"
      - run: python -m ruff check --fix .
      - run: python -m ruff format .
      - name: Commit only formatting changes
        run: |
          if ! git diff --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -am "style: apply automated Ruff formatting"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
