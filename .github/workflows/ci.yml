name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pinned direct dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint and formatting
        run: python scripts/tasks.py lint
      - name: Strict core typing
        run: python scripts/tasks.py typecheck
      - name: Unit tests and coverage
        run: python scripts/tasks.py test
      - name: Smoke diagnostics, no GPU/network needed
        run: python scripts/tasks.py bench
      - name: Verify generated result table
        run: python scripts/render_results.py --check
      - name: Dependency vulnerability audit
        run: python -m pip_audit --skip-editable

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
